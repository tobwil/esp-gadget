; Taschenfunk · YT-Music-Player, Taschenuhr, Timer und Walkie-Talkie
; Board: Waveshare ESP32-S3-Touch-AMOLED-1.75C (ESP32-S3R8, 8 MB PSRAM, 32 MB Flash, davon 16 MB genutzt)
;
;   pio run -t upload        kompilieren & per USB-C aufspielen
;   pio device monitor       Log ansehen

[env:amoled-175c]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L

build_flags =
  -Iinclude
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=1
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_CONF_PATH=lv_conf.h

lib_deps =
  lvgl/lvgl@9.2.2
  moononournation/GFX Library for Arduino@1.6.9
  lewisxhe/SensorLib@0.3.3
  bblanchon/ArduinoJson@7.4.2
